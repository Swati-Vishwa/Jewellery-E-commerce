<section class="relative w-full h-dvh overflow-hidden select-none">
  <!-- Hero banner image -->
  <img [src]="HeroBannerImage()" [alt]="HeroBannerAlt()"
    class="absolute inset-0 top-0 left-0 h-full w-full object-cover object-[65%_30%] overflow-x-hidden">
    
  <!-- overlay -->
  <div class="absolute inset-0 bg-black/20"></div>

  <!-- content -->
  <div class="relative top-0 left-0 z-20 h-full flex flex-col justify-center items-center">
    <div class="flex flex-col items-center gap-7">
      <h1 class="text-[110px] text-light-yellow font-aboreto uppercase">Timeless by Design.</h1>
      <p class="text-3xl font-caveat text-light-grey">Timeless jewelry designed with intention, artistry, and exceptional
        craftsmanship.</p>
      <div class="pt-7">
        <app-hero-button></app-hero-button>
      </div>
    </div>
  </div>
</section>
