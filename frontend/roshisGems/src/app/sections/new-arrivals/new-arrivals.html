<section class="flex flex-col justify-center items-center gap-7">
  <div class="flex gap-5 pt-20">
    <div class="flex flex-col gap-6">
      <div class="w-full">
        <h3 class="text-5xl font-alike font-medium">{{newArrivalTitle()}}</h3>
      </div>
      <div class="flex justify-center gap-5">
        @for (product of products(); track product.id) {
        <app-product-card [product]="product"></app-product-card>
        }
      </div>
    </div>
    <div class="w-40 h-40 sm:w-56 sm:h-56 md:w-73 md:h-90 mt-5 border-3 border-grey-orange rounded-tl-4xl rounded-br-4xl overflow-hidden">
      <img 
        [src]="newArrivalFeatureDetail().image" 
        [alt]="newArrivalFeatureDetail().altText"
        class="w-full h-full object-cover object-[70%_40%]">
    </div>
  </div>
  <div>
    <a 
      href="/" 
      class="text-2xl underline underline-offset-4 text-grey-orange hover:text-grey-orange/70">
      View {{newArrivalTitle()}} 
    </a>
  </div>
</section>
